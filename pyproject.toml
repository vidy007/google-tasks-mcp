[project]
name = "google-tasks-mcp"
version = "0.1.0"
description = "MCP server for Google Tasks: create, read and complete tasks from Claude"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=1.2",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
google-tasks-mcp = "google_tasks_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
